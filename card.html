<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital NFC Business Card - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --accent-primary: #10b981;
            --accent-secondary: #2dd4bf;
            --accent-glow: rgba(20, 184, 166, 0.22);
            --card-bg-start: rgba(13, 25, 34, 0.92);
            --card-bg-end: rgba(7, 10, 18, 0.97);
            --card-border: rgba(45, 212, 191, 0.35);
            --btn-bg-start: rgba(19, 54, 58, 0.85);
            --btn-bg-end: rgba(13, 36, 42, 0.92);
        }

        body {
            background: #030508;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image:
                radial-gradient(circle at 50% 12%, var(--accent-glow) 0%, transparent 55%),
                radial-gradient(circle at 85% 88%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
            background-attachment: fixed;
            transition: background-image 0.4s ease;
        }

        .phone-frame {
            background: linear-gradient(155deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.9), 0 0 35px var(--accent-glow);
            transition: all 0.35s ease;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px var(--accent-glow);
        }

        .comm-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .comm-btn:hover {
            background: rgba(30, 41, 59, 0.95);
            border-color: var(--accent-secondary);
            transform: translateY(-2px) scale(1.04);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-3 sm:p-5">

    <!-- Loading State -->
    <div id="loader" class="text-center">
        <div class="w-12 h-12 border-4 border-t-transparent rounded-full animate-spin mx-auto mb-4"
            style="border-color: var(--accent-primary); border-top-color: transparent;">
        </div>
        <p class="text-sm text-slate-400 font-medium tracking-wide">Memuat kartu NFC...</p>
    </div>

    <!-- Main Profile Card Container -->
    <div id="profileContainer"
        class="hidden max-w-[400px] w-full phone-frame rounded-[2.6rem] p-6 text-center relative overflow-hidden my-auto">

        <!-- Cahaya Ambient Atas -->
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-60 h-60 rounded-full blur-3xl pointer-events-none"
            style="background: var(--accent-glow);">
        </div>

        <!-- Header Status NFC & Ganti Tema -->
        <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-widest mb-3 relative z-10"
            style="color: var(--accent-secondary);">
            <span class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full animate-ping" style="background: var(--accent-primary);"></span> NFC Verified
            </span>
            <div class="flex items-center gap-3">
                <button onclick="cycleTheme()" class="text-slate-300 hover:text-white transition-colors cursor-pointer"
                    title="Ganti Tema Warna">
                    <i class="fa-solid fa-palette text-xs"></i>
                </button>
                <button onclick="shareProfile()" class="text-slate-300 hover:text-white transition-colors cursor-pointer"
                    title="Bagikan Profil">
                    <i class="fa-solid fa-share-nodes text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Avatar / Foto Profil Bulat dengan Ring Cahaya -->
        <div class="relative w-28 h-28 mx-auto mb-4 rounded-full p-1 shadow-xl"
            style="background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));">
            <div class="w-full h-full rounded-full overflow-hidden bg-slate-950 flex items-center justify-center">
                <img id="profileImage" src="" class="w-full h-full object-cover hidden">
                <span id="initials" class="text-3xl font-extrabold" style="color: var(--accent-secondary);">MR</span>
            </div>
        </div>

        <!-- Nama, Jabatan & Bio -->
        <div class="relative z-10">
            <h1 id="pNama" class="text-xl font-extrabold tracking-tight text-white uppercase">Memuat Nama...</h1>
            <p id="pJabatan" class="text-xs text-slate-200 font-semibold mt-1">Jabatan</p>
            <p id="pPerusahaan" class="text-[11px] uppercase tracking-widest mt-0.5 font-bold"
                style="color: var(--accent-secondary);">Perusahaan</p>
            <p id="pBio" class="hidden text-[11px] text-slate-300/80 mt-3 px-3 leading-relaxed"></p>
        </div>

        <!-- Baris Ikon Media Sosial -->
        <div id="socialContainer" style="display: none;"
            class="relative z-10 items-center justify-center gap-3.5 mt-5 flex-wrap"></div>

        <!-- Garis Pemisah -->
        <div class="flex items-center my-5">
            <div class="flex-grow border-t border-white/10"></div>
            <div class="w-2.5 h-2.5 rounded-full mx-3 bg-slate-950 flex items-center justify-center border"
                style="border-color: var(--accent-primary);">
                <div class="w-1 h-1 rounded-full" style="background: var(--accent-secondary);"></div>
            </div>
            <div class="flex-grow border-t border-white/10"></div>
        </div>

        <!-- Tombol Aksi Utama -->
        <div class="space-y-3 relative z-10">
            <a id="btnAction1" href="#" target="_blank"
                class="action-btn w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl text-xs font-extrabold text-white tracking-wide shadow-lg">
                <i class="fa-brands fa-whatsapp text-emerald-400 text-sm"></i> HUBUNGI VIA WHATSAPP
            </a>
            <a id="btnWebsite" href="#" target="_blank"
                class="action-btn w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl text-xs font-extrabold text-white tracking-wide shadow-lg">
                <i class="fa-solid fa-globe text-sm" style="color: var(--accent-secondary);"></i> KUNJUNGI WEBSITE
            </a>
            <button onclick="saveContact()"
                class="action-btn w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl text-xs font-extrabold text-white tracking-wide shadow-lg cursor-pointer">
                <i class="fa-solid fa-address-card text-sm" style="color: var(--accent-secondary);"></i> SIMPAN KONTAK (vCard)
            </button>
        </div>

        <!-- Garis Pemisah Kedua -->
        <div class="flex items-center my-5">
            <div class="flex-grow border-t border-white/10"></div>
            <div class="w-2.5 h-2.5 rounded-full mx-3 bg-slate-950 flex items-center justify-center border"
                style="border-color: var(--accent-primary);">
                <div class="w-1 h-1 rounded-full" style="background: var(--accent-secondary);"></div>
            </div>
            <div class="flex-grow border-t border-white/10"></div>
        </div>

        <!-- Bagian Komunikasi Cepat -->
        <div class="relative z-10">
            <p class="text-[11px] font-semibold text-slate-400 mb-3 tracking-wide">Komunikasi Cepat</p>
            <div class="flex items-center justify-center gap-3.5">
                <a id="btnEmail" href="#"
                    class="comm-btn w-12 h-12 rounded-2xl flex items-center justify-center text-slate-200 text-lg shadow-md"
                    title="Kirim Email">
                    <i class="fa-solid fa-envelope"></i>
                </a>
                <a id="btnWhatsapp" href="#" target="_blank"
                    class="comm-btn w-12 h-12 rounded-2xl flex items-center justify-center text-emerald-400 text-xl shadow-md"
                    title="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a id="btnTelegram" href="#" target="_blank"
                    class="comm-btn w-12 h-12 rounded-2xl flex items-center justify-center text-sky-400 text-lg shadow-md"
                    title="Media Lain / LinkedIn">
                    <i class="fa-solid fa-paper-plane"></i>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-[9px] text-slate-400/70 mt-7 tracking-widest uppercase">POWERED BY MITRA RATING 2026</p>
    </div>

    <!-- Error State -->
    <div id="errorBox" class="hidden text-center phone-frame p-8 rounded-[2.5rem] max-w-sm w-full">
        <p class="text-2xl mb-2">⚠️</p>
        <h2 class="text-base font-bold text-red-400">Kartu Tidak Ditemukan</h2>
        <p class="text-xs text-slate-400 mt-1.5">Pastikan link NFC yang Anda akses sudah benar atau terdaftar di database.</p>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwtPVF6-E9qbs29iCMko_kHrgiH03FWUrAEsQUaW0q3rPwLGG8YqPa016WoIvyKtJulRw/exec";
        let contactData = {};
        const THEME_KEYS = ['emerald', 'gold', 'sapphire', 'rosegold'];
        let activeThemeIndex = 0;

        const THEMES = {
            emerald: {
                primary: "#10b981",
                secondary: "#2dd4bf",
                glow: "rgba(20, 184, 166, 0.22)",
                bgStart: "rgba(13, 28, 36, 0.94)",
                bgEnd: "rgba(6, 11, 18, 0.98)",
                border: "rgba(45, 212, 191, 0.35)",
                btnStart: "rgba(19, 54, 58, 0.85)",
                btnEnd: "rgba(13, 36, 42, 0.92)"
            },
            gold: {
                primary: "#f59e0b",
                secondary: "#fcd34d",
                glow: "rgba(245, 158, 11, 0.22)",
                bgStart: "rgba(32, 24, 14, 0.94)",
                bgEnd: "rgba(10, 8, 6, 0.98)",
                border: "rgba(251, 191, 36, 0.4)",
                btnStart: "rgba(66, 48, 22, 0.85)",
                btnEnd: "rgba(40, 28, 12, 0.92)"
            },
            sapphire: {
                primary: "#3b82f6",
                secondary: "#38bdf8",
                glow: "rgba(59, 130, 246, 0.24)",
                bgStart: "rgba(14, 24, 46, 0.94)",
                bgEnd: "rgba(6, 10, 22, 0.98)",
                border: "rgba(56, 189, 248, 0.38)",
                btnStart: "rgba(22, 42, 78, 0.85)",
                btnEnd: "rgba(14, 26, 52, 0.92)"
            },
            rosegold: {
                primary: "#f43f5e",
                secondary: "#fda4af",
                glow: "rgba(244, 63, 94, 0.22)",
                bgStart: "rgba(36, 16, 26, 0.94)",
                bgEnd: "rgba(12, 6, 10, 0.98)",
                border: "rgba(251, 113, 133, 0.38)",
                btnStart: "rgba(68, 26, 42, 0.85)",
                btnEnd: "rgba(44, 16, 28, 0.92)"
            }
        };

        function applyTheme(themeName) {
            const key = THEMES[themeName] ? themeName : 'emerald';
            activeThemeIndex = THEME_KEYS.indexOf(key);
            const t = THEMES[key];
            const root = document.documentElement;

            root.style.setProperty('--accent-primary', t.primary);
            root.style.setProperty('--accent-secondary', t.secondary);
            root.style.setProperty('--accent-glow', t.glow);
            root.style.setProperty('--card-bg-start', t.bgStart);
            root.style.setProperty('--card-bg-end', t.bgEnd);
            root.style.setProperty('--card-border', t.border);
            root.style.setProperty('--btn-bg-start', t.btnStart);
            root.style.setProperty('--btn-bg-end', t.btnEnd);
        }

        function cycleTheme() {
            activeThemeIndex = (activeThemeIndex + 1) % THEME_KEYS.length;
            applyTheme(THEME_KEYS[activeThemeIndex]);
        }

        function getField(obj, keys) {
            if (!obj) return "";
            const objKeys = Object.keys(obj);
            for (const target of keys) {
                const found = objKeys.find(k => k.toLowerCase().trim() === target.toLowerCase());
                if (found && obj[found] !== null && obj[found] !== undefined && String(obj[found]).trim() !== "") {
                    return String(obj[found]).trim();
                }
            }
            return "";
        }

        async function fetchCardData() {
            const urlParams = new URLSearchParams(window.location.search);
            const cardId = urlParams.get('id');
            const urlTheme = urlParams.get('theme');

            if (urlTheme) applyTheme(urlTheme);

            if (!cardId) {
                showError();
                return;
            }

            try {
                const response = await fetch(`${WEB_APP_URL}?id=${cardId}`);
                const res = await response.json();

                if (res.status === "success") {
                    contactData = res.data;
                    const savedTheme = getField(contactData, ['tema', 'theme']);
                    if (!urlTheme && savedTheme) {
                        applyTheme(savedTheme);
                    }
                    renderProfile(contactData);
                } else {
                    showError();
                }
            } catch (err) {
                showError();
            }
        }

        function renderProfile(data) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('profileContainer').classList.remove('hidden');

            const nama = getField(data, ['nama', 'name']) || "Tanpa Nama";
            const jabatan = getField(data, ['jabatan', 'title', 'posisi']) || "Sales & Marketing";
            const perusahaan = getField(data, ['perusahaan', 'company', 'brand']) || "Mitra Rating.id";
            const bio = getField(data, ['bio', 'tagline', 'deskripsi']);
            const foto = getField(data, ['foto', 'photo', 'gambar']);
            const telepon = getField(data, ['telepon', 'whatsapp', 'wa', 'phone', 'no_wa']);
            const email = getField(data, ['email', 'mail']);
            const website = getField(data, ['website', 'web', 'url']);

            document.getElementById('pNama').textContent = nama;
            document.getElementById('pJabatan').textContent = jabatan;
            document.getElementById('pPerusahaan').textContent = perusahaan;

            if (bio) {
                const bioEl = document.getElementById('pBio');
                bioEl.textContent = bio;
                bioEl.classList.remove('hidden');
            }

            if (foto) {
                const pImg = document.getElementById('profileImage');
                pImg.src = foto;
                pImg.classList.remove('hidden');
                document.getElementById('initials').classList.add('hidden');
            } else {
                const initials = nama.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                document.getElementById('initials').textContent = initials;
            }

            const cleanPhone = telepon.replace(/\D/g, '');
            document.getElementById('btnAction1').href = `https://wa.me/${cleanPhone}?text=Halo%20${encodeURIComponent(nama)},%20saya%20tertarik%20dengan%20penawaran%20Anda.`;

            const webUrl = website ? (website.startsWith('http') ? website : `https://${website}`) : '#';
            document.getElementById('btnWebsite').href = webUrl;

            const linkedinVal = getField(data, ['linkedin', 'li']);
            document.getElementById('btnEmail').href = `mailto:${email}`;
            document.getElementById('btnWhatsapp').href = `https://wa.me/${cleanPhone}`;
            document.getElementById('btnTelegram').href = linkedinVal ? (linkedinVal.startsWith('http') ? linkedinVal : `https://${linkedinVal}`) : `https://t.me/${cleanPhone}`;

            const igVal = getField(data, ['instagram', 'ig']);
            const ttVal = getField(data, ['tiktok', 'tt']);
            const twVal = getField(data, ['twitter', 'x', 'tw']);
            const fbVal = getField(data, ['facebook', 'fb']);
            const ytVal = getField(data, ['youtube', 'yt']);

            const socialList = [];

            if (igVal) {
                const url = igVal.startsWith('http') ? igVal : `https://instagram.com/${igVal.replace(/^@/, '')}`;
                socialList.push({ url, icon: 'fa-brands fa-instagram', color: 'hover:text-pink-400 hover:border-pink-500/40', title: 'Instagram' });
            }
            if (ttVal) {
                const url = ttVal.startsWith('http') ? ttVal : `https://tiktok.com/@${ttVal.replace(/^@/, '')}`;
                socialList.push({ url, icon: 'fa-brands fa-tiktok', color: 'hover:text-white hover:border-slate-400', title: 'TikTok' });
            }
            if (linkedinVal) {
                const url = linkedinVal.startsWith('http') ? linkedinVal : `https://${linkedinVal}`;
                socialList.push({ url, icon: 'fa-brands fa-linkedin-in', color: 'hover:text-blue-400 hover:border-blue-400/40', title: 'LinkedIn' });
            }
            if (twVal) {
                const url = twVal.startsWith('http') ? twVal : `https://x.com/${twVal.replace(/^@/, '')}`;
                socialList.push({ url, icon: 'fa-brands fa-x-twitter', color: 'hover:text-sky-400 hover:border-sky-500/40', title: 'X / Twitter' });
            }
            if (fbVal) {
                const url = fbVal.startsWith('http') ? fbVal : `https://facebook.com/${fbVal}`;
                socialList.push({ url, icon: 'fa-brands fa-facebook-f', color: 'hover:text-blue-500 hover:border-blue-500/40', title: 'Facebook' });
            }
            if (ytVal) {
                const url = ytVal.startsWith('http') ? ytVal : `https://youtube.com/${ytVal}`;
                socialList.push({ url, icon: 'fa-brands fa-youtube', color: 'hover:text-red-500 hover:border-red-500/40', title: 'YouTube' });
            }

            const socialContainer = document.getElementById('socialContainer');
            if (socialList.length > 0) {
                socialContainer.innerHTML = socialList.map(item => `
                    <a href="${item.url}" target="_blank" title="${item.title}"
                       class="w-10 h-10 rounded-2xl bg-slate-900/90 border border-white/10 flex items-center justify-center text-slate-200 ${item.color} text-base transition-all shadow-md hover:-translate-y-1">
                        <i class="${item.icon}"></i>
                    </a>
                `).join('');
                socialContainer.style.display = 'flex';
            }
        }

        function showError() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('errorBox').classList.remove('hidden');
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: `${getField(contactData, ['nama'])} - Digital NFC Card`,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Tautan kartu digital disalin ke clipboard!");
            }
        }

        function saveContact() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${getField(contactData, ['nama'])}
TITLE:${getField(contactData, ['jabatan'])}
ORG:${getField(contactData, ['perusahaan'])}
TEL;TYPE=CELL:${getField(contactData, ['telepon'])}
EMAIL:${getField(contactData, ['email'])}
URL:${getField(contactData, ['website'])}
NOTE:${getField(contactData, ['bio'])}
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(getField(contactData, ['nama']) || 'Contact').replace(/\s+/g, '_')}_Contact.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        fetchCardData();
    </script>
</body>

</html>
